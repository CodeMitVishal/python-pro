# Alembic configuration for the Module 23 demo.
# Usage (from inside 23_sqlalchemy_alembic):
#   alembic upgrade head        apply every migration
#   alembic downgrade -1        undo the last one
#   alembic history             list migrations
#   alembic revision --autogenerate -m "add column"   compare models.py with the DB

[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///shop.db

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
